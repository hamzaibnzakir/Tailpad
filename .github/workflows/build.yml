name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc:
    name: Windows app (TailPad.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test pc/TailPad.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish pc/TailPad.Host -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: TailPad-Windows
          path: out/TailPad.exe

  ios:
    name: iPhone app (TailPad.ipa, unsigned for Sideloadly)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project TailPad.xcodeproj -target TailPad -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT="$PWD/build" -quiet build
      - name: Package .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Release-iphoneos/TailPad.app Payload/
          zip -qry TailPad.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TailPad-iPhone
          path: ios/TailPad.ipa

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TailPad-Windows/TailPad.exe
            dist/TailPad-iPhone/TailPad.ipa
