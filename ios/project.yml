name: TailPad
options:
  bundleIdPrefix: com.hamzaibnzakir
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_PREVIEWS: "YES"
targets:
  TailPad:
    type: application
    platform: iOS
    sources:
      - path: TailPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzaibnzakir.tailpad
        INFOPLIST_FILE: TailPad/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
