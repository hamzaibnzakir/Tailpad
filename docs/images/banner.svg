<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="TailPad — your iPhone is the controller, your PC is the console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D11"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A3A"/>
      <stop offset="0.55" stop-color="#1F6F8B"/>
      <stop offset="0.8" stop-color="#F9844A"/>
      <stop offset="1" stop-color="#7B2CBF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <!-- text -->
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="84" font-weight="800" fill="#E8EBF1" letter-spacing="-2">Tail<tspan fill="#39FF88">Pad</tspan></text>
    <text x="74" y="204" font-size="27" font-weight="500" fill="#C4CAD6">Your iPhone is the controller.</text>
    <text x="74" y="240" font-size="27" font-weight="500" fill="#C4CAD6">Your PC is the console.</text>
    <text x="74" y="284" font-size="18" fill="#8A92A6">Custom touch pads · gyro · macros · remote play — over Tailscale</text>

    <!-- chips -->
    <g font-size="15" font-weight="600">
      <rect x="72" y="320" width="150" height="36" rx="18" fill="#171B22" stroke="#2C3240"/>
      <text x="147" y="343" text-anchor="middle" fill="#E8EBF1">Xbox &amp; PS pad</text>
      <rect x="234" y="320" width="132" height="36" rx="18" fill="#171B22" stroke="#2C3240"/>
      <text x="300" y="343" text-anchor="middle" fill="#E8EBF1">Remote play</text>
      <rect x="378" y="320" width="98" height="36" rx="18" fill="#171B22" stroke="#2C3240"/>
      <text x="427" y="343" text-anchor="middle" fill="#E8EBF1">Any game</text>
      <rect x="488" y="320" width="118" height="36" rx="18" fill="#14261C" stroke="#39FF88" stroke-opacity="0.5"/>
      <text x="547" y="343" text-anchor="middle" fill="#39FF88">1 exe · 1 ipa</text>
    </g>
  </g>

  <!-- laptop -->
  <g transform="translate(960 52) scale(0.86)">
    <rect x="0" y="0" width="300" height="190" rx="12" fill="#1B2029" stroke="#2C3240" stroke-width="2"/>
    <rect x="12" y="12" width="276" height="166" rx="6" fill="url(#screen)"/>
    <path d="M-28 196h356l-16 22H-12z" fill="#232936" stroke="#2C3240" stroke-width="2"/>
    <rect x="124" y="198" width="52" height="6" rx="3" fill="#0E1014"/>
  </g>

  <!-- tailscale link -->
  <g fill="none" stroke="#39FF88" stroke-linecap="round">
    <path d="M1042 300 C 1090 300, 1112 280, 1112 246" stroke-width="3" stroke-dasharray="2 10" stroke-opacity="0.8"/>
  </g>
  <g transform="translate(1124 300)" fill="#39FF88">
    <circle cx="0" cy="0" r="3.2"/><circle cx="10" cy="0" r="3.2"/><circle cx="20" cy="0" r="3.2" opacity="0.45"/>
    <circle cx="0" cy="10" r="3.2" opacity="0.45"/><circle cx="10" cy="10" r="3.2"/><circle cx="20" cy="10" r="3.2"/>
  </g>

  <!-- phone (landscape) with the stream + pad -->
  <g transform="translate(700 210) scale(0.84)">
    <ellipse cx="200" cy="168" rx="200" ry="14" fill="#000" opacity="0.45" filter="url(#soft)"/>
    <rect x="0" y="0" width="400" height="180" rx="34" fill="#0B0D11" stroke="#3A4256" stroke-width="3"/>
    <rect x="14" y="12" width="372" height="156" rx="24" fill="url(#screen)"/>
    <rect x="22" y="66" width="8" height="48" rx="4" fill="#000"/>
    <!-- see-through controls -->
    <g fill="#0E1014" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5">
      <circle cx="92" cy="104" r="40"/>
      <circle cx="92" cy="104" r="16" fill="#2B3140" fill-opacity="0.9"/>
      <rect x="54" y="22" width="56" height="18" rx="6"/>
      <rect x="290" y="22" width="56" height="18" rx="6"/>
      <circle cx="318" cy="72" r="15"/>
      <circle cx="318" cy="132" r="15"/>
      <circle cx="288" cy="102" r="15"/>
      <circle cx="348" cy="102" r="15"/>
      <circle cx="228" cy="130" r="24"/>
    </g>
    <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="318" y="77" fill="#FFD166">Y</text>
      <text x="318" y="137" fill="#3ECF6E">A</text>
      <text x="288" y="107" fill="#5AA9FF">X</text>
      <text x="348" y="107" fill="#FF6B6B">B</text>
    </g>
    <rect x="150" y="18" width="104" height="18" rx="9" fill="#171B22" fill-opacity="0.9"/>
    <circle cx="162" cy="27" r="3.5" fill="#39FF88"/>
    <text x="210" y="31" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#C4CAD6" text-anchor="middle">LIVE · 720p60</text>
  </g>
</svg>
